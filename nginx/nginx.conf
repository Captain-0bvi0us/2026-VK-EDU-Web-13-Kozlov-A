worker_processes auto;
events { worker_connections 1024; }
http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile on; tcp_nopush on;
    gzip on; gzip_comp_level 5; gzip_min_length 256; gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cupofq:10m max_size=100m inactive=10m use_temp_path=off;
    upstream django { server web:8000; keepalive 16; }
    upstream demo   { server wsgi_demo:8081; keepalive 16; }
    server {
        listen 80 default_server;
        server_name _;
        location ^~ /uploads/ {
            alias /srv/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }
        location ^~ /static/ {
            alias /srv/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
        location ~* \.(?:js|css|jpe?g|png|gif|svg|ico|webp|woff2?|ttf|eot|map|html)$ {
            root /srv/static;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /demo-cached/ {
            proxy_cache cupofq; proxy_cache_valid 200 1m;
            proxy_cache_key "$scheme$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://demo/;
        }
        location /demo/   { proxy_pass http://demo/; }
        location /cached/ {
            proxy_cache cupofq; proxy_cache_valid 200 1m;
            proxy_cache_key "$scheme$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://django/;
        }
        location / { proxy_pass http://django; }
    }
}
