<div class="sidebar-card p-3 mb-3">
  <h2>Популярные теги</h2>
  <div class="tag-cloud">
    {% for t in popular_tags %}
      <a href="{% url 'tag' tag=t.slug %}" class="{% if t.size == 'sm' %}t-sm{% elif t.size == 'lg' %}t-lg{% elif t.size == 'md' %}t-md{% elif t.size == 'accent' %}t-accent t-sm{% elif t.size == 'warm' %}t-warm t-sm{% else %}t-sm{% endif %}">{{ t.name }}</a>
    {% endfor %}
  </div>
</div>
<div class="sidebar-card p-3">
  <h2>Лучшие участники</h2>
  <ol class="best-members">
    {% for m in best_members %}
      <li><a href="{% url 'tag' tag=m.slug %}">{{ m.name }}</a></li>
    {% endfor %}
  </ol>
</div>
