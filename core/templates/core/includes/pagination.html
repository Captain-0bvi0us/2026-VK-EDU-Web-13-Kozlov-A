{% if page.has_other_pages %}
<nav class="mt-4" aria-label="Постраничная навигация">
  <ul class="pagination flex-wrap mb-0">
    {% if page.has_previous %}
      <li class="page-item">
        <a class="page-link" href="{{ request.path }}?page={{ page.previous_page_number }}">Назад</a>
      </li>
    {% endif %}
    {% for num in page.paginator.page_range %}
      <li class="page-item {% if page.number == num %}active{% endif %}" {% if page.number == num %}aria-current="page"{% endif %}>
        {% if page.number == num %}
          <span class="page-link">{{ num }}</span>
        {% else %}
          <a class="page-link" href="{{ request.path }}?page={{ num }}">{{ num }}</a>
        {% endif %}
      </li>
    {% endfor %}
    {% if page.has_next %}
      <li class="page-item">
        <a class="page-link" href="{{ request.path }}?page={{ page.next_page_number }}">Вперёд</a>
      </li>
    {% endif %}
  </ul>
</nav>
{% endif %}
