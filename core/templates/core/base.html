{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title|default:"CupOfQ" }}{% endblock %}</title>
  <link rel="icon" href="{% static 'core/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/cupofq.css' %}">
</head>
<body>
  <div class="site-wrap">
    {% include "core/includes/header.html" %}
    <main class="site-main">
      <div class="container py-4">
        <div class="row g-4">
          <div class="col-lg-8 order-2 order-lg-1">
            {% block content %}{% endblock %}
          </div>
          <aside class="col-lg-4 order-1 order-lg-2">
            {% include "core/includes/sidebar.html" %}
          </aside>
        </div>
      </div>
    </main>
    {% include "core/includes/footer.html" %}
  </div>
  <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
