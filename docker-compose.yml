services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    volumes:
      - cupofq_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - cupofq_media:/app/media
    env_file:
      - .env.docker
    environment:
      DJANGO_RUN_IN_DOCKER: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

volumes:
  cupofq_pgdata:
  cupofq_media:
