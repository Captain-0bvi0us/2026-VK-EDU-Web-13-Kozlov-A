services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    volumes:
      - cupofq_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cupofq_redisdata:/data
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --config=/centrifugo/config.json
    env_file:
      - .env.docker
    volumes:
      - ./centrifugo:/centrifugo:ro
    ports:
      - "${CENTRIFUGO_PUBLISH_PORT:-8001}:8000"
    restart: unless-stopped

  maildev:
    image: maildev/maildev:latest
    environment:
      MAILDEV_SMTP_PORT: "1025"
      MAILDEV_WEB_PORT: "1080"
    ports:
      - "${MAILDEV_SMTP_PUBLISH_PORT:-1025}:1025"
      - "${MAILDEV_WEB_PUBLISH_PORT:-1080}:1080"
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "${WEB_PUBLISH_PORT:-8000}:8000"
    volumes:
      - .:/app
      - cupofq_static:/app/static
      - cupofq_media:/app/media
    env_file:
      - .env.docker
    environment:
      DJANGO_RUN_IN_DOCKER: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_WS_URL: ws://localhost:${CENTRIFUGO_PUBLISH_PORT:-8001}/connection/websocket
      EMAIL_HOST: maildev
      EMAIL_PORT: "1025"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn -c gunicorn/django.conf.py application.wsgi:application"
    restart: unless-stopped

  wsgi_demo:
    build: .
    expose:
      - "8081"
    ports:
      - "${WSGI_DEMO_PUBLISH_PORT:-8081}:8081"
    volumes:
      - .:/app
    command: gunicorn -c gunicorn/demo.conf.py wsgi_demo.app:application
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "${NGINX_PUBLISH_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - cupofq_static:/srv/static:ro
      - cupofq_media:/srv/media:ro
    restart: unless-stopped

  celery_worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - cupofq_media:/app/media
    env_file:
      - .env.docker
    environment:
      DJANGO_RUN_IN_DOCKER: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      EMAIL_HOST: maildev
      EMAIL_PORT: "1025"
    command: celery -A application worker -l info
    restart: unless-stopped

  celery_beat:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - cupofq_media:/app/media
    env_file:
      - .env.docker
    environment:
      DJANGO_RUN_IN_DOCKER: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: celery -A application beat -l info -S redbeat.RedBeatScheduler
    restart: unless-stopped

volumes:
  cupofq_pgdata:
  cupofq_media:
  cupofq_redisdata:
  cupofq_static:
